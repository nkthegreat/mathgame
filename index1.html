<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Το Μαγικό Κάστρο των Μαθηματικών</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2937;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f4f6;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Timer */
        .timer-container {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background: var(--warning);
            width: 100%;
            transition: width 1s linear, background-color 0.5s;
        }

        /* Problem Box */
        .problem-box {
            font-size: 3rem;
            font-weight: 800;
            color: #111827;
            margin: 20px 0;
            background: #f8fafc;
            border: 3px dashed #cbd5e1;
            border-radius: 16px;
            padding: 20px;
            letter-spacing: 2px;
        }

        /* Answer Input & Buttons */
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 140px;
            padding: 12px;
            font-size: 1.8rem;
            text-align: center;
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-large {
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            margin-top: 10px;
        }

        /* Feedback Animation */
        #feedback {
            font-size: 1.1rem;
            font-weight: 700;
            height: 30px;
            margin-bottom: 15px;
        }

        .correct { color: var(--success); }
        .wrong { color: var(--danger); }

        /* Results Screen */
        .trophy {
            font-size: 4rem;
            margin: 15px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .reward-card {
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 16px;
            padding: 15px;
            margin: 20px 0;
            color: #166534;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- ΑΡΧΙΚΗ ΟΘΟΝΗ -->
        <div id="start-screen" class="screen active">
            <h1>🏰 Μαγικά Μαθηματικά</h1>
            <p class="subtitle">Εξάσκηση στην πρόσθεση (έως το 20) για ηλικίες 6-7 ετών!</p>
            <div style="font-size: 4rem; margin: 20px 0;">➕🧮⭐</div>
            <button class="btn-large" onclick="startGame()">Ξεκίνησε το Παιχνίδι!</button>
        </div>

        <!-- ΟΘΟΝΗ ΠΑΙΧΝΙΔΙΟΥ -->
        <div id="game-screen" class="screen">
            <div class="stats-bar">
                <span id="question-counter">Άσκηση: 1/10</span>
                <span id="score-counter">⭐ Πόντοι: 0</span>
            </div>

            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div id="feedback"></div>

            <div class="problem-box" id="problem-text">5 + 3 = ?</div>

            <div class="input-group">
                <input type="number" id="user-answer" placeholder="?" autocomplete="off">
                <button onclick="checkAnswer()">ΟΚ</button>
            </div>
        </div>

        <!-- ΟΘΟΝΗ ΑΠΟΤΕΛΕΣΜΑΤΩΝ -->
        <div id="result-screen" class="screen">
            <h1>Μπράβο σου! 🎉</h1>
            <div class="trophy" id="result-trophy">🏆</div>
            <p id="final-score-text" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px;">Βασικές Πληροφορίες</p>
            
            <div class="reward-card" id="reward-description">
                <!-- Εδώ μπαίνει το δώρο -->
            </div>

            <button class="btn-large" onclick="startGame()">Παίξε Ξανά!</button>
        </div>

    </div>

    <script>
        const TOTAL_QUESTIONS = 10;
        const TIME_PER_QUESTION = 12; // 12 δευτερόλεπτα

        let currentQuestion = 0;
        let score = 0;
        let num1, num2, correctAnswer;
        let timer;
        let timeLeft = TIME_PER_QUESTION;

        // Web Audio API για ήχους χωρίς εξωτερικά αρχεία
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            currentQuestion = 0;
            score = 0;
            nextQuestion();
            showScreen('game-screen');
        }

        function nextQuestion() {
            if (currentQuestion >= TOTAL_QUESTIONS) {
                endGame();
                return;
            }

            currentQuestion++;
            document.getElementById('question-counter').innerText = `Άσκηση: ${currentQuestion}/${TOTAL_QUESTIONS}`;
            document.getElementById('score-counter').innerText = `⭐ Πόντοι: ${score}`;
            document.getElementById('feedback').innerText = '';
            document.getElementById('user-answer').value = '';

            // Δημιουργία πρόσθεσης με άθροισμα έως το 20
            correctAnswer = -1;
            while (correctAnswer < 2 || correctAnswer > 20) {
                num1 = Math.floor(Math.random() * 12) + 1; // 1 έως 12
                num2 = Math.floor(Math.random() * 12) + 1; // 1 έως 12
                correctAnswer = num1 + num2;
            }

            document.getElementById('problem-text').innerText = `${num1} + ${num2} = ?`;
            document.getElementById('user-answer').focus();

            // Εκκίνηση χρονοδιαμέτρησης
            clearInterval(timer);
            timeLeft = TIME_PER_QUESTION;
            updateTimerBar();
            
            timer = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / TIME_PER_QUESTION) * 100;
            const bar = document.getElementById('timer-bar');
            bar.style.width = percentage + '%';
            if (percentage > 50) {
                bar.style.backgroundColor = 'var(--success)';
            } else if (percentage > 20) {
                bar.style.backgroundColor = 'var(--warning)';
            } else {
                bar.style.backgroundColor = 'var(--danger)';
            }
        }

        function checkAnswer() {
            clearInterval(timer);
            const userIn = document.getElementById('user-answer');
            const userVal = parseInt(userIn.value);
            const feedback = document.getElementById('feedback');

            if (isNaN(userVal)) {
                // Αν δεν πληκτρολόγησε τίποτα
                nextQuestion();
                return;
            }

            if (userVal === correctAnswer) {
                score += 10;
                playSound('correct');
                feedback.innerText = 'Σωστό! Μπράβο! 🎉';
                feedback.className = 'correct';
            } else {
                playSound('wrong');
                feedback.innerText = `Λάθος! Η σωστή απάντηση ήταν ${correctAnswer}`;
                feedback.className = 'wrong';
            }

            setTimeout(nextQuestion, 1200);
        }

        function handleTimeOut() {
            playSound('wrong');
            const feedback = document.getElementById('feedback');
            feedback.innerText = `Τελείωσε ο χρόνος! ⏱️ (Ήταν ${correctAnswer})`;
            feedback.className = 'wrong';
            setTimeout(nextQuestion, 1500);
        }

        // Enter key listener
        document.getElementById('user-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function endGame() {
            showScreen('result-screen');
            document.getElementById('final-score-text').innerText = `Σκορ: ${score} / ${TOTAL_QUESTIONS * 10} πόντους`;

            let trophyEmoji = '🏆';
            let rewardText = '';

            if (score === TOTAL_QUESTIONS * 10) {
                trophyEmoji = '🚀';
                rewardText = '🌟 Master των Μαθηματικών!\nΚέρδισες το Διαστημικό Κύπελλο και μια επίσκεψη στο αγαπημένο σου πάρκο ψυχαγωγίας ή το επιτραπέζιο που ήθελες!';
            } else if (score >= 70) {
                trophyEmoji = '🔬';
                rewardText = '🥈 Μετάλλιο του Επιστήμονα!\nΕξαιρετική δουλειά! Κέρδισες μια κινηματογραφική βραδιά με ποπ κορν και λιχουδιές!';
            } else if (score >= 50) {
                trophyEmoji = '🌟';
                rewardText = '🌱 Αστέρι της Προσπάθειας!\nΠολύ καλή προσπάθεια! Συνεχίζεις δυνατά για το επόμενο ρεκόρ!';
            } else {
                trophyEmoji = '💪';
                rewardText = '💡 Συνεχίστε την εξάσκηση!\nΜε λίγη ακόμα προσπάθεια στην επόμενη δοκιμή θα πάρεις το μεγάλο κύπελλο!';
            }

            document.getElementById('result-trophy').innerText = trophyEmoji;
            document.getElementById('reward-description').innerText = rewardText;
        }
    </script>
</body>
</html>
